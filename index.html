<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gioco dell'Impostore</title>
    <script src="script.js" defer></script>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: Arial, sans-serif;
        }
        #word {
            font-size: 2rem;
            margin-bottom: 20px;
        }
        button {
            padding: 10px 20px;
            font-size: 1rem;
            margin: 5px;
        }
    </style>
</head>
<body>
    
  <script src="https://unpkg.com/@dotlottie/player-component@latest/dist/dotlottie-player.mjs" type="module"></script> 

  <dotlottie-player onclick="window.location = 'https://simonevetere.github.io/xyz/'" src="https://lottie.host/9ee46b02-06d9-4f3d-b58d-894706d76640/Ug2gQBGp1U.json" background="transparent" speed="1" style="position: fixed;z-index: 9999;width: 64px; height: 64px; right: 0; top: 0;" loop autoplay></dotlottie-player>
    <div id="word">Inizia il gioco!</div>
    <input type="number" id="numPlayers" placeholder="Numero di giocatori" min="2">
    <button id="startGameButton">Inizia il gioco</button>
    <button onclick="location.reload()">restart</button>
    <div id="playerButtons" style="display:none;"></div>
</body>
</html>
